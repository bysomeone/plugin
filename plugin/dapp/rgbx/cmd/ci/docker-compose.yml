services:
  main:
    build:
      context: .
    environment:
      ChainConfig: "chain33.test.toml"
    ports:
      - "8801:8801"
      - "8802:8802"
    volumes:
      - ./btcd-data:/btcd:ro
      - main-data:/root/datadir

  para1:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para1.toml"
    depends_on:
      main:
        condition: service_started
      btcd:
        condition: service_healthy
    volumes:
      - ./btcd-data:/btcd:ro
      - para1-data:/root/paradatadir
    # RGB20（Phase 5）：官方节点 rgb20 适配器 HTTP（充值请求 + consignment 上传 + 测试 sign-psbt）。
    ports:
      - "17000:17000"

  para2:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para2.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro
      - para2-data:/root/paradatadir

  para3:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para3.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro
      - para3-data:/root/paradatadir

  para4:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para4.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro
      - para4-data:/root/paradatadir

  btcd:
    # RPC TLS cert auto-gen uses os.Hostname(); must match Docker DNS name "btcd"
    # so para/lightclient can dial btcd:18443 without SAN mismatch.
    hostname: btcd
    build:
      context: .
      dockerfile: Dockerfile.btcd
      args:
        BTCD_VERSION: "${BTCD_VERSION:-v0.24.2}"
    command:
      - btcd
      - --regtest
      # 显式指定非默认 datadir：btcd 的 removeRegressionDB() 在 --regtest 下、且 datadir
      # 为默认值（~/.btcd/data）时，每次启动都会删掉 regtest 链。指定一个不同路径即可
      # 跳过删除（仍落在 ./btcd-data 挂载内）。否则每次容器重启都会清链，导致 chain33
      # lightclient 已存的 BTC 头链与 btcd 新链错位、充值 SPV 永久验不过。
      - --datadir=/root/.btcd/chain
      - --txindex
      - --addrindex
      - --rpclisten=0.0.0.0:18443
      - --rpcuser=${BTCD_RPC_USER:-root}
      - --rpcpass=${BTCD_RPC_PASS:-1314}
      - --listen=0.0.0.0:18444
      - --miningaddr=mrCDrCybB6J1vRfbwM5hemdJz73FwDBC8r
      - --debuglevel=info
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - ./btcd-data:/root/.btcd
    healthcheck:
      test: ["CMD", "btcctl", "--configfile=/tmp/btcctl.conf", "--regtest", "--rpcserver=127.0.0.1:18443", "--rpcuser=${BTCD_RPC_USER:-root}", "--rpcpass=${BTCD_RPC_PASS:-1314}", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  main-data:
  para1-data:
  para2-data:
  para3-data:
  para4-data:
