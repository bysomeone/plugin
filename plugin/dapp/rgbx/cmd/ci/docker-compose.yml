services:
  main:
    build:
      context: .
    environment:
      ChainConfig: "chain33.test.toml"
    ports:
      - "8801:8801"
      - "8802:8802"
    volumes:
      - ./btcd-data:/btcd:ro

  para1:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para1.toml"
    depends_on:
      main:
        condition: service_started
      btcd:
        condition: service_healthy
    volumes:
      - ./btcd-data:/btcd:ro
    # RGB20（Phase 5）：官方节点 rgb20 适配器 HTTP（充值请求 + consignment 上传 + 测试 sign-psbt）。
    ports:
      - "17000:17000"

  para2:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para2.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro

  para3:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para3.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro

  para4:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para4.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro

  btcd:
    # RPC TLS cert auto-gen uses os.Hostname(); must match Docker DNS name "btcd"
    # so para/lightclient can dial btcd:18443 without SAN mismatch.
    hostname: btcd
    build:
      context: .
      dockerfile: Dockerfile.btcd
      args:
        BTCD_VERSION: "${BTCD_VERSION:-v0.24.2}"
    command:
      - btcd
      - --regtest
      - --txindex
      - --addrindex
      - --rpclisten=0.0.0.0:18443
      - --rpcuser=${BTCD_RPC_USER:-root}
      - --rpcpass=${BTCD_RPC_PASS:-1314}
      - --listen=0.0.0.0:18444
      - --miningaddr=mrCDrCybB6J1vRfbwM5hemdJz73FwDBC8r
      - --debuglevel=info
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - ./btcd-data:/root/.btcd
    healthcheck:
      test: ["CMD", "btcctl", "--configfile=/tmp/btcctl.conf", "--regtest", "--rpcserver=127.0.0.1:18443", "--rpcuser=${BTCD_RPC_USER:-root}", "--rpcpass=${BTCD_RPC_PASS:-1314}", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ===== RGB20 (Phase 5)：RGB 链 =====
  # bitcoind regtest（RGB 链）+ electrs 索引 + RGB 侧车，全部走 compose 内部网络。
  # 宿主 macOS 二进制无法进 Linux 容器，故 electrs/侧车在 Docker 内构建（Dockerfile.electrs/sidecar）。
  rgb-bitcoind:
    image: lncm/bitcoind:v27.2
    command:
      - -regtest
      - -datadir=/data
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001
      - -rpcuser=${RGB20_BITCOIND_USER:-rgb}
      - -rpcpassword=${RGB20_BITCOIND_PASS:-rgbpass123}
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
    volumes:
      - rgb-bitcoind-data:/data
    ports:
      - "18543:18443"
      - "18544:18444"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=${RGB20_BITCOIND_USER:-rgb}", "-rpcpassword=${RGB20_BITCOIND_PASS:-rgbpass123}", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30

  rgb-electrs:
    build:
      context: .
      dockerfile: Dockerfile.electrs
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /data/regtest
        printf 'rgb:rgbpass123' > /data/regtest/.cookie
        exec electrs --network=regtest --db-dir=/electrs-db --daemon-dir=/data           --daemon-rpc-addr=rgb-bitcoind:18443 --daemon-p2p-addr=rgb-bitcoind:18444           --electrum-rpc-addr=0.0.0.0:60401
    volumes:
      - rgb-bitcoind-data:/data
      - rgb-electrs-db:/electrs-db
    depends_on:
      rgb-bitcoind:
        condition: service_healthy
    ports:
      - "60401:60401"

  rgb-sidecar:
    build:
      context: .
      dockerfile: Dockerfile.sidecar
    environment:
      RGB_SIDECAR_DATA_DIR: /data
      RGB_SIDECAR_ELECTRUM: rgb-electrs:60401
      RGB_SIDECAR_NETWORK: regtest
      RGB_SIDECAR_TSS_PUBKEY: ${RGB20_TSS_PUBKEY:-}
      RGB_SIDECAR_LISTEN: 0.0.0.0:50061
      RGB_SIDECAR_TEST_LISTEN: 0.0.0.0:50064
      RGB_BITCOIND_RPC: http://rgb-bitcoind:18443
      RGB_BITCOIND_USER: ${RGB20_BITCOIND_USER:-rgb}
      RGB_BITCOIND_PASS: ${RGB20_BITCOIND_PASS:-rgbpass123}
    volumes:
      - rgb-sidecar-data:/data
    depends_on:
      rgb-electrs:
        condition: service_started
    ports:
      - "50061:50061"
      - "50064:50064"

volumes:
  rgb-bitcoind-data:
  rgb-electrs-db:
  rgb-sidecar-data:
