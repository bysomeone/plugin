# 镜像架构：跟随宿主，由 docker-compose.sh 按 uname -m 推导成 RGBX_CI_PLATFORM（可显式覆盖）。
#
# 不要在这里写死 linux/amd64。chain33 二进制是 `make build_ci` 按 `go env GOARCH` 编出来的
# （Makefile:37-44），在 M1 上是 linux/arm64；写死 amd64 会让镜像架构与镜像里的二进制不符 ——
# 之所以还能跑，是靠宿主 binfmt 把静态 arm64 ELF 接走，代价是容器里其余一切（shell、btcd、
# electrs 的 Rust 构建）全走 QEMU 翻译，本地实测把这轮 E2E 拖到 25 分钟。Docker Desktop 也会
# 对这个镜像挂 "image may have poor performance ... via emulation" 警告。
# amd64 宿主（含 GitHub Actions runner）上推导结果仍是 linux/amd64，行为不变。
services:
  main:
    platform: ${RGBX_CI_PLATFORM:-linux/amd64}
    build:
      context: .
    environment:
      ChainConfig: "chain33.test.toml"
    ports:
      - "8801:8801"
      - "8802:8802"
    volumes:
      - ./btcd-data:/btcd:ro
      - main-data:/root/datadir

  para1:
    platform: ${RGBX_CI_PLATFORM:-linux/amd64}
    build:
      context: .
    environment:
      ChainConfig: "chain33.para1.toml"
    depends_on:
      main:
        condition: service_started
      btcd:
        condition: service_healthy
    volumes:
      - ./btcd-data:/btcd:ro
      - para1-data:/root/paradatadir
    # RGB20（Phase 5）：官方节点 rgb20 适配器 HTTP（充值请求 + consignment 上传 + 测试 sign-psbt）。
    # 17001：P2WSH 充值地址发放入口（neutrino.depositAddressListen）——桥要先 watch 用户的派生
    # 脚本才看得见充值，所以地址必须**向桥要**，E2E 用 BRIDGE_DEPOSIT_URL（默认 127.0.0.1:17001）
    # 从这里领。只有官方节点开这个监听，故只发布 para1。
    ports:
      - "17000:17000"
      - "17001:17001"

  para2:
    platform: ${RGBX_CI_PLATFORM:-linux/amd64}
    build:
      context: .
    environment:
      ChainConfig: "chain33.para2.toml"
    depends_on:
      - main
    restart: unless-stopped
    volumes:
      - ./btcd-data:/btcd:ro
      - para2-data:/root/paradatadir

  para3:
    platform: ${RGBX_CI_PLATFORM:-linux/amd64}
    build:
      context: .
    environment:
      ChainConfig: "chain33.para3.toml"
    depends_on:
      - main
    restart: unless-stopped
    volumes:
      - ./btcd-data:/btcd:ro
      - para3-data:/root/paradatadir

  para4:
    platform: ${RGBX_CI_PLATFORM:-linux/amd64}
    build:
      context: .
    environment:
      ChainConfig: "chain33.para4.toml"
    depends_on:
      - main
    restart: unless-stopped
    volumes:
      - ./btcd-data:/btcd:ro
      - para4-data:/root/paradatadir

  btcd:
    platform: ${RGBX_CI_PLATFORM:-linux/amd64}
    # RPC TLS cert auto-gen uses os.Hostname(); must match Docker DNS name "btcd"
    # so para/lightclient can dial btcd:18443 without SAN mismatch.
    hostname: btcd
    build:
      context: .
      dockerfile: Dockerfile.btcd
      args:
        BTCD_VERSION: "${BTCD_VERSION:-v0.24.2}"
    command:
      - btcd
      - --regtest
      # 注意：--datadir 在这里**并不能**阻止 btcd 清链。btcd v0.24.2 的 removeRegressionDB()
      # 只以 cfg.RegressionTest 为门（btcd.go 里 loadBlockDB 无条件调用它，注释即 "needs a
      # clean database for each run"），而 dbPath 是 <datadir>/<net>/blocks_ffldb（config.go
      # 已把网络名拼到 DataDir 末尾）——换路径照样被删。
      # 结论：regtest 链只在"btcd 容器不被重建/重启"时存活；需要全新环境请用
      # ./docker-compose.sh reset，别指望改 datadir。详见 docker-compose.sh 的 start_env。
      - --datadir=/root/.btcd/chain
      - --txindex
      - --addrindex
      - --rpclisten=0.0.0.0:18443
      - --rpcuser=${BTCD_RPC_USER:-root}
      - --rpcpass=${BTCD_RPC_PASS:-1314}
      - --listen=0.0.0.0:18444
      - --miningaddr=mrCDrCybB6J1vRfbwM5hemdJz73FwDBC8r
      - --debuglevel=info
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - ./btcd-data:/root/.btcd
    healthcheck:
      test: ["CMD", "btcctl", "--configfile=/tmp/btcctl.conf", "--regtest", "--rpcserver=127.0.0.1:18443", "--rpcuser=${BTCD_RPC_USER:-root}", "--rpcpass=${BTCD_RPC_PASS:-1314}", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  main-data:
  para1-data:
  para2-data:
  para3-data:
  para4-data:
