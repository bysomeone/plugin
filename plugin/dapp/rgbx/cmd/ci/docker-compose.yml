services:
  main:
    build:
      context: .
    environment:
      ChainConfig: "chain33.test.toml"
    ports:
      - "8801:8801"
      - "8802:8802"
    volumes:
      - ./btcd-data:/btcd:ro
      - main-data:/root/datadir

  para1:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para1.toml"
    depends_on:
      main:
        condition: service_started
      btcd:
        condition: service_healthy
    volumes:
      - ./btcd-data:/btcd:ro
      - para1-data:/root/paradatadir
    # RGB20（Phase 5）：官方节点 rgb20 适配器 HTTP（充值请求 + consignment 上传 + 测试 sign-psbt）。
    ports:
      - "17000:17000"

  para2:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para2.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro
      - para2-data:/root/paradatadir

  para3:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para3.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro
      - para3-data:/root/paradatadir

  para4:
    build:
      context: .
    environment:
      ChainConfig: "chain33.para4.toml"
    depends_on:
      - main
    volumes:
      - ./btcd-data:/btcd:ro
      - para4-data:/root/paradatadir

  btcd:
    # RPC TLS cert auto-gen uses os.Hostname(); must match Docker DNS name "btcd"
    # so para/lightclient can dial btcd:18443 without SAN mismatch.
    hostname: btcd
    build:
      context: .
      dockerfile: Dockerfile.btcd
      args:
        BTCD_VERSION: "${BTCD_VERSION:-v0.24.2}"
    command:
      - btcd
      - --regtest
      # 注意：--datadir 在这里**并不能**阻止 btcd 清链。btcd v0.24.2 的 removeRegressionDB()
      # 只以 cfg.RegressionTest 为门（btcd.go 里 loadBlockDB 无条件调用它，注释即 "needs a
      # clean database for each run"），而 dbPath 是 <datadir>/<net>/blocks_ffldb（config.go
      # 已把网络名拼到 DataDir 末尾）——换路径照样被删。
      # 结论：regtest 链只在"btcd 容器不被重建/重启"时存活；需要全新环境请用
      # ./docker-compose.sh reset，别指望改 datadir。详见 docker-compose.sh 的 start_env。
      - --datadir=/root/.btcd/chain
      - --txindex
      - --addrindex
      - --rpclisten=0.0.0.0:18443
      - --rpcuser=${BTCD_RPC_USER:-root}
      - --rpcpass=${BTCD_RPC_PASS:-1314}
      - --listen=0.0.0.0:18444
      - --miningaddr=mrCDrCybB6J1vRfbwM5hemdJz73FwDBC8r
      - --debuglevel=info
    ports:
      - "18443:18443"
      - "18444:18444"
    volumes:
      - ./btcd-data:/root/.btcd
    healthcheck:
      test: ["CMD", "btcctl", "--configfile=/tmp/btcctl.conf", "--regtest", "--rpcserver=127.0.0.1:18443", "--rpcuser=${BTCD_RPC_USER:-root}", "--rpcpass=${BTCD_RPC_PASS:-1314}", "getblockcount"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  main-data:
  para1-data:
  para2-data:
  para3-data:
  para4-data:
