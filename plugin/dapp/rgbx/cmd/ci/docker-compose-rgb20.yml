# RGB20 (Phase 5) 独立 compose override 文件。
# 与基础 docker-compose.yml 合并使用：docker compose -f docker-compose.yml -f docker-compose-rgb20.yml ...
# 1) 给 main 加健康检查（chain33-cli 可查询即 RPC ready），para 等待 main healthy 再启动——
#    para 启动即连主链 grpc(8802)，main 未就绪时 para 会 panic 退出（Phase 5 DKG 修复，环境时序）。
# 2) para1-4 depends_on main 提升为 service_healthy。
# 3) RGB20 链收敛到单 btcd（Phase 5 收尾）：删除独立的 rgb-bitcoind/rgb-electrs；RGB 侧车直接以
#    TLS 连 btcd 的 JSON-RPC（bitcoind 不服务 BIP157 是原 SPV EOF 根因；btcd 全节点即 RGB 链）。

services:
  main:
    healthcheck:
      test: ["CMD", "/root/chain33-cli", "--conf=chain33.test.toml", "block", "last_header"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  para1:
    depends_on:
      main:
        condition: service_healthy
      btcd:
        condition: service_healthy

  para2:
    depends_on:
      main:
        condition: service_healthy

  para3:
    depends_on:
      main:
        condition: service_healthy

  para4:
    depends_on:
      main:
        condition: service_healthy

  # ===== RGB20 (Phase 5)：RGB 侧车 =====
  # RGB 链 = btcd（base compose）。侧车/issue_usdt/test-sim 全部通过 btcd JSON-RPC（TLS，信任
  # btcd 自签 rpc.cert，凭据 root/1314）读取同一条链，与 para neutrino(connectPeers=btcd:18444)
  # 同步的头一致 → 解 lightclient SPV 头验证 EOF。
  # 侧车源码只有一个权威副本：plugin/dapp/lightclient/rpc/lightclient/neutrino/rgb-sidecar/
  # （Dockerfile 也在那里，compose 默认取上下文里的 Dockerfile）。本文件被 make docker-compose
  # 拷进 build/ci/rgbx-ci/ 后在那里运行，故相对路径 ../../.. 即仓根；可用 RGB_SIDECAR_SRC 覆盖。
  rgb-sidecar:
    build:
      context: ${RGB_SIDECAR_SRC:-../../../plugin/dapp/lightclient/rpc/lightclient/neutrino/rgb-sidecar}
    environment:
      RGB_SIDECAR_DATA_DIR: /data
      RGB_SIDECAR_NETWORK: regtest
      RGB_SIDECAR_TSS_PUBKEY: ${RGB20_TSS_PUBKEY:-}
      RGB_SIDECAR_LISTEN: 0.0.0.0:50061
      RGB_SIDECAR_TEST_LISTEN: 0.0.0.0:50064
      RGB_BITCOIND_RPC: ${RGB20_BITCOIND_RPC:-btcd:18443}
      RGB_BITCOIND_USER: ${RGB20_BITCOIND_USER:-root}
      RGB_BITCOIND_PASS: ${RGB20_BITCOIND_PASS:-1314}
      RGB_BITCOIND_CERT: ${RGB20_BITCOIND_CERT:-/btcd/rpc.cert}
    volumes:
      - ./btcd-data:/btcd:ro
      - rgb-sidecar-data:/data
    depends_on:
      btcd:
        condition: service_healthy
    ports:
      - "50061:50061"
      - "50064:50064"

volumes:
  rgb-sidecar-data:
