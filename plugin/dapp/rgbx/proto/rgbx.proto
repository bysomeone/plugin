syntax = "proto3";

package types;
option  go_package = "../types";

message RgbxAction {
    int32 ty = 1;
    oneof value {
        mintAsset     mint      = 2;
        transferAsset transfer  = 3;
        confirmTx     confirm   = 4;
        commitDKG     commitDKG = 5;
        depositAsset  deposit   = 6;
        withdrawAsset withdraw  = 7;
        crossChainAssetMeta crossChainMeta = 8;
        unlockAsset   unlock    = 9;
        bridgeConfigApply   bridgeConfigApply   = 10;
        bridgeConfigApprove bridgeConfigApprove = 11;
        abandonWithdraw     abandon            = 12;
        registerDepositScript registerDepositScript = 13;
        bumpWithdrawFee     bumpWithdrawFee     = 14;
    }
}

// registerDepositScript 绑定用户专属 BTC 充值地址（一步完成）。
//
// tx.From() 即 userID；执行时用 BTC 资产的 CrossChainInfo.pubkey 现场派生 P2WSH 地址，
// 写入登记表，并在回执日志（TyDepositScriptLog）里返回完整地址信息。幂等：重复绑定
// 返回同一结果。地址查询只读登记表——未绑定不返回派生值，否则用户可能向桥未监听的
// 脚本充值。
message registerDepositScript {
}

message depositScriptItem {
    string userID   = 1;
    string address  = 2;
    string pkScript = 3; // hex of OP_0 <sha256(witnessScript)>
    string spec     = 4;
    int64  height   = 5;
    int32  index    = 6;
}

message depositScriptList {
    repeated depositScriptItem items = 1;
}

// bridgeConfigApply 桥配置变更申请（第一步）。
//
// 配置的权威来自同链的 autonomy 治理：本 action 只把拟生效的**完整快照**落成一条
// 待审批记录（key = 本交易哈希），提案人再在 autonomy 提交 Item 引用它；董事会投票
// 通过后由 bridgeConfigApprove 生效。执行器不明白名单，也不认单个地址。
//
// assetSymbol 为空表示全局配置：只允许 limitsEnabled / pauseDeposit / pauseWithdraw /
// largeDeposit* 生效，数值型上限必须为 0；非空表示该资产的数值上限。
//
// 大额提现的延迟只能由桥执行（付款在链下），链上无法验证，因此这里只保留充值侧
// 可控的旋钮：大额充值要求更深的 BTC 确认数。
//
// fields 是**单项更新掩码**：为空时整条配置全量替换（原有行为）；非空时只更新列出的
// 字段，其余字段沿用同名记录（global / 该资产）在链上的现值，首次申请时未列出的字段
// 取默认零值。字段名就是本 message 的字段名（assetSymbol 除外，它标识记录本身）；
// 出现未知字段名时整笔申请被拒绝，不静默忽略。列表字段（rgb20WithdrawFee）命中掩码时
// 整体替换，不做逐条合并。
message bridgeConfigApply {
    string assetSymbol = 1;
    // 总开关：关闭时不做任何数值上限检查（暂停开关仍独立生效）。
    bool   limitsEnabled = 2;
    // 数值上限，单位为该资产最小单位；0 表示不限。
    int64  maxPerTx              = 3;
    int64  maxPerWindow1h        = 4;
    int64  maxPerWindow24h       = 5;
    int64  maxMintPerWindow      = 6;
    // 大额充值：金额达到阈值后，额外要求这么多 BTC 确认（在基础确认数之上）。
    int64  largeDepositThreshold          = 7;
    int64  largeDepositExtraConfirmations = 8;
    // 紧急制动，按方向独立；只能由治理流程改变。
    bool   pauseDeposit  = 9;
    bool   pauseWithdraw = 10;
    // BTC 计价提现的矿工费率上限（sat/vB）。BTC 提现与 RGB20 的 BTC 付费通道共用。
    // 取值范围 1..1000（执行器硬边界 maxBtcFeeRate）；0 表示未设置（不额外限制）。
    uint32 withdrawMaxFeeRateSatPerVbyte = 11;
    // RGB20 的 BTC 付费通道估算 xBTC 锁定上限时采用的**保守交易体积**（vB）。
    // 取值范围 1..2000（maxRgb20WithdrawFeeLockVbytes）；0 表示未设置。
    uint32 rgb20WithdrawFeeLockVbytes = 12;
    // RGB20 资产 U 通道的固定手续费（按资产 symbol，单位为该资产最小单位）。
    // 掩码命中时整体替换列表。每个 symbol 必须是已登记且 assetKind = RGB20 的跨链资产。
    repeated rgb20WithdrawFee rgb20WithdrawFee = 13;
    // 单项更新掩码：空 = 全量更新；非空 = 只更新列出的字段。见本 message 的说明。
    repeated string fields = 14;
}

// rgb20WithdrawFee RGB20 资产 U 通道的固定手续费（最小单位，0 合法）。
message rgb20WithdrawFee {
    string symbol      = 1;
    int64  feeMinUnits = 2;
}

// bridgeConfigApprove 配置生效（第二步）。执行器必须向同链 autonomy 查询
// IsAutonomyApprovedItem(itemId, applyConfigId)，通过后才把申请里的快照写入共识状态。
message bridgeConfigApprove {
    string applyConfigId  = 1;
    string autonomyItemId = 2;
}

// abandonWithdraw 放弃一笔尚未结算的提现（业务提案）。
//
// 链上只存证：由 tx.From() 记录提案人，平行链节点各自用**本地白名单**判断是否受理。
// 受理后节点进入 abandoning 单向状态，用 TSS 组签名走 unlockAsset 退回台账记录的 owner。
// 与资产无关：BTC / RGB20 都走同一条流程。
message abandonWithdraw {
    // 被放弃的 Withdraw（锁定）交易哈希。
    bytes  burnTxHash = 1;
    // 退款接收人，必须与锁定时写入的台账 owner 逐字相等（交叉校验，防止手误）。
    string owner      = 2;
    string reason     = 3;
}

// unlockAsset 放弃一笔尚未结算的提现：把仍锁在桥锁定地址里的金额退回给提现发起人。
//
// 它是"后验必然失败"的逃生口（侧车明确判定重试永远不可能成功，且该 pending 尚未产生
// 任何付款签名）。授权只来自 TSS 门限组签名 unlockSig —— 链上不解析任何外部协议，
// 也不认单个地址的提交（提交者是谁无关紧要，签名才决定是否允许）。
//
// 摘要必须与充值签名做域分隔，见 types.UnlockSignDigest。
message unlockAsset {
    // 被放弃的 Withdraw（锁定）交易哈希。
    bytes  burnTxHash  = 1;
    string assetSymbol = 2;
    // 退款金额与接收方：必须与锁定时写入的台账记录逐字相等（链上以台账为准，
    // 这里的值参与摘要绑定，防止签名被挪到别的金额/收款人上）。
    int64  amount      = 3;
    string owner       = 4;
    // TSS 组签名（DER 序列化）。
    bytes  unlockSig   = 5;
}

message rgbxAsset {

    uint32 type             = 1;
    uint32 precision        = 2;
    int64  totalAmount      = 3;
    string symbol           = 4;
    bytes  metaHash         = 5;
    string genesisBtcTxHash = 6;
    string owner            = 7;
}

message mintAsset {
    uint32 type        = 1;
    uint32 precision   = 2;
    int64  totalAmount = 3;
    string symbol      = 4;
    bytes  metaHash    = 5;
    // represents the outpoint of the transaction's
    // input that resulted in the creation of the asset.
    outPoint genesisOut = 6;
}

message outPoint {
    string hash     = 1;
    uint32 index    = 2;
    bytes  pkScript = 3;
}

message utxoSpendingProof {
    uint32 spendingInputIdx    = 1;
    int32  opRetOutputIdx      = 2;
}

message transferAsset {

    string symbol           = 1;
    int64  amount           = 2;
    string fromUtxo         = 3;
    string to               = 4;
    string changeAddr       = 5;
    bytes  fromUtxoPkScript = 6;
}

message confirmTx {

    int32             actionType           = 1;
    int64             confirmedBlockHeight = 2;
    int64             txBlockHeight        = 3;
    int64             txIndex              = 4;
    bytes             txHash               = 5;
    bool              timeout              = 6;
    utxoSpendingProof utxoProof            = 7;
    btcTxProof        btcTxProof           = 8;
    // consignmentHash 是 RGB20 提现交付的 consignment 的 sha256（32 字节）。
    // 仅当 pending 资产是 RGB20 类时允许非空；BTC 类提现必须为空。空表示桥本地没有该笔
    // 提现的 consignment 记录（确认照常提交，结算不受影响）。
    bytes             consignmentHash      = 9;
}

message btcTxProof {
    uint64         blockHeight = 1;
    uint32         txIndex     = 2;
    string         blockHash   = 3;
    bytes          txData      = 4;
    repeated bytes merkleProof = 5;
}

message commitDKG {

    string assetSymbol = 1;
    string dkgAddress  = 2;
    bytes  pkScript    = 3;
    // TSS 组公钥（压缩 secp256k1），RGB20 分支 checkCommitDKG 校验 hash160(pubkey)==pkScript[2:]（BL-1）
    bytes  pubkey      = 4;
    // 资产类别（跨链资产的链上登记类目，见 types.CrossChainAssetKind）：
    // 决定充值/提现走哪条门禁分支，**不再**由 symbol 字面量推断。
    uint32 assetKind   = 5;
    // 精度（小数位）。BTC 类资产恒为 rtypes.BTCChainPrecision（checkCommitDKG 强制）；
    // RGB20 类在 DKG 提交时**未知**（合约还没发行/侧车还没核对），必须传
    // rtypes.PrecisionUnknown，由发行后回填（crossChainAssetMeta）写入真实值。
    uint32 precision   = 6;
}

message depositAsset {

    int64      amount         = 1;
    string     depositAddress = 2;
    string     assetSymbol    = 3;
    btcTxProof txProof        = 4;
    // RGB20 分支的 TSS 阈值签名（DER，对 C=sha256(types.Encode(DepositAsset{thresholdSig:nil}))）
    bytes      thresholdSig   = 5;
    // 用户签名的充值请求（仅 RGB20 分支要求）。铸造的收款地址与金额钉死在这份签名上，
    // 桥/网关都无法改收款人；requestId 用于防重放。字段含义见 depositrequest 包。
    string     requestId           = 6;
    int64      requestTimestamp    = 7;
    bytes      requestPubkey       = 8;
    bytes      requestSignature    = 9;
}

message withdrawAsset {

    int64  amount          = 1;
    int64  feeRate         = 2;
    string destinationAddr = 3;
    string assetSymbol     = 4;
}

message crossChainInfo {

    string assetSymbol   = 1;
    string wrappedSymbol = 2;
    string tssAddress    = 3;
    bytes  pkScript      = 4;
    // TSS 组公钥（压缩 secp256k1），RGB20 分支验 thresholdSig 用（BL-1）
    bytes  pubkey        = 5;
    // 资产类别（链上登记的类目，由 CommitDKG 写入，见 types.CrossChainAssetKind）。
    uint32 assetKind     = 6;
    // 精度（小数位）：前端 / CLI 换算金额的**唯一**依据，不再要求调用方手填。
    // BTC 类由 CommitDKG 写死 8；RGB20 类在 CommitDKG 时是 types.PrecisionUnknown，
    // 由桥在核对出合约声明的精度后经 crossChainAssetMeta 回填（回填前读取方必须拒绝换算）。
    uint32 precision     = 7;
}

// crossChainAssetMeta 跨链资产元数据回填（发行后回填路径）。
//
// 为什么需要它：RGB20 资产的精度只能来自合约，而合约在 DKG 提交时往往还没发行 / 还没被侧车
// 采纳（连侧车与等 DKG 是两条独立的启动路径），因此精度不可能随首次 CommitDKG 一起落链；
// 而 CommitDKG 的语义是"每个 symbol 只提交一次"（组公钥不可换，重复提交一律被拒），不能靠
// 二次 CommitDKG 补写。所以精度走这条**一次性回填**动作：桥在侧车报告出合约精度、并与链上
// 记录逐项比对通过之后提交它；链上只接受"从未回填过"（precision == PrecisionUnknown）或
// "回填成同一个值"（幂等重发）两种情况，一旦写入即不可改写。
message crossChainAssetMeta {

    string assetSymbol = 1;
    uint32 precision   = 2;
}

message pendingTx {
    int32    actionType    = 1;
    int64    timestamp     = 2;
    int64    txBlockHeight = 3;
    int64    txIndex       = 4;
    int64    amount        = 5;
    int64    feeRate       = 6;
    bytes    txHash        = 7;
    outPoint utxo          = 8;
    string   fromAddress   = 9;
    string   assetSymbol   = 10;
    string   targetAddress = 11;
    bool     confirmed     = 12;
}

message pendingTxs {
    repeated pendingTx pendingList = 1;
}

message utxo {
    string outPoint = 1;
    int64  amount   = 2;
    bytes  pkScript = 3;
}

message ReqListPendingTx {
    int64 startHeight = 1;
    int64 startIndex  = 2;
    int32 count       = 3;
    int64 endHeight   = 4;
}

message ReqGetPendingTx {
    int64 height = 1;
    int64 index  = 2;
}

// abandonWithdrawItem 一条已上链的放弃提现提案（链上只存证）。
message abandonWithdrawItem {
    bytes  txHash     = 1; // 提案交易哈希
    bytes  burnTxHash = 2;
    string owner      = 3;
    string reason     = 4;
    string proposer   = 5;
    int64  height     = 6;
    int32  index      = 7;
}

message abandonWithdrawList {
    repeated abandonWithdrawItem items = 1;
}

message btcCommitment {
    bytes  protocol = 1;
    uint32 action   = 2;
    bytes  payload  = 3;
}

message txBlockIndex {
    int64 blockHeight = 1;
    int64 txIndex     = 2;
}

message txBlockIndexList {
    repeated txBlockIndex blockIndexList = 1;
}

// ================= 全局 operationId + 铸造台账（S2）=================
//
// 每笔充值（铸造）与提现（销毁）都分配一个 32 字节全局 operationId，链上留下一条**不可变**记录
// （operationRecord），并维护每 symbol 的**单调**供应量计数（operationSupply）。
// operationId 不是外部输入，而是由链上已校验的数据**确定性派生**（见 types/operation.go）：
//   - 充值：sha256("rgbx:opid:v1:mint:" | symbol | btc txid | 充值地址 | 金额)；
//   - 提现：sha256("rgbx:opid:v1:burn:" | symbol | burn 的 chain33 交易哈希)。
//
// 于是"同一个 operationId" ⟺ "同一笔操作"，派生式 id 无法被伪造、无法被顶替，也不需要
// 在交易里额外携带字段（P2WSH 充值路径下没有 OP_RETURN 可承载）。
//
// 提现结算时以该台账为判据：必须存在对应的 burn 记录、金额与 payload 逐项一致，
// 且**待提取的额度不超过台账里"已铸造 − 已销毁"** —— 即每个离开桥的单位都必须有一条
// 充值铸造记录，而不是靠对某个地址的余额求和来推断。
message operationRecord {
    // operationId 32 字节全局操作 id（派生式，见上）
    bytes  operationId   = 1;
    // kind 1=铸造（充值） 2=销毁（提现）
    int32  kind          = 2;
    // symbol 归一化后的跨链资产符号（如 "XBTC" / "XRGB20_USDT"）
    string symbol        = 3;
    // network 该操作所属的源/目标网络标识（由 symbol 确定性导出，不读节点本地配置）
    string network       = 4;
    // amount 资产最小单位金额（充值=实际到账额；提现=锁定额）
    int64  amount        = 5;
    // owner 充值归属地址 / 提现发起地址
    string owner         = 6;
    // btcTxID 充值：付款那笔 BTC 交易的规范 txid（32 字节）；提现为空
    bytes  btcTxID       = 7;
    // chain33TxHash 该操作所在的 chain33 交易哈希（充值=上链的充值交易；提现=burn 交易）
    bytes  chain33TxHash = 8;
    // height / timestamp 该操作所在区块的高度与时间
    int64  height        = 9;
    int64  timestamp     = 10;
    // settled 仅由查询侧补算（提现=是否已结算放款；充值=已铸造，恒 true），**不入库**
    bool   settled       = 11;
}

message operationSupply {
    string symbol        = 1;
    string network       = 2;
    // minted / burned 累计铸造 / 累计销毁（资产最小单位）；minted - burned 即"桥仍欠的额度"
    int64  minted        = 3;
    int64  burned        = 4;
    // nextMintIndex / nextBurnIndex 下一个索引下标（生成本 symbol 的操作列表用）
    int64  nextMintIndex = 5;
    int64  nextBurnIndex = 6;
}

message operationRecords {
    repeated operationRecord records = 1;
    // nextIndex 下一页的起始下标（本页取满 count 条时才有意义；否则为 0）
    int64                   nextIndex = 2;
}

message ReqGetOperation {
    bytes operationId = 1;
}

message ReqListOperations {
    string assetSymbol = 1;
    // kind 1=铸造 2=销毁（必须显式指定：两类操作各自一条索引）
    int32  kind        = 2;
    // start 起始下标（首次查询填 0；后续用上一次返回的 nextIndex 续查）
    int64  start       = 3;
    int32  count       = 4;
}

// bumpWithdrawFee 请求提高一笔尚未结算提现的矿工费率（由提现发起人本人提交）。
//
// 链上只记录请求并发事件，不改变提现的结算 / 放弃逻辑：桥按高度区间轮询到请求后，
// 用新费率重签一笔替换交易。链上只要求新费率高于原提现费率且不超过上限；不锚定上一次
// bump 请求（被桥拒绝的请求不应占位），是否高于"上一次真正应用的费率"由桥侧判断。
message bumpWithdrawFee {
    // 被加价的 Withdraw（锁定）交易哈希。
    bytes withdrawalTxHash = 1;
    // 新的矿工费率（sat/vB）。
    int64 feeRate          = 2;
}

// bumpWithdrawFeeItem 一条已上链的提现加价请求（链上只存证 + 发事件）。
message bumpWithdrawFeeItem {
    bytes  txHash           = 1; // 本次 bump 交易哈希
    bytes  withdrawalTxHash = 2; // 被加价的 Withdraw 交易哈希
    string owner            = 3; // 提现发起人（也是 bump 提交人）
    int64  feeRate          = 4; // bump 后的费率
    int64  oldFeeRate       = 5; // 加价基准：被 bump 提现的原费率
    int64  height           = 6;
    int32  index            = 7;
}

message bumpWithdrawFeeList {
    repeated bumpWithdrawFeeItem items = 1;
}

// withdrawConsignment 是 RGB20 提现确认结算的回执日志：登记「哪笔 burn ↔ 哪份 consignment」，
// 便于按区块核对链上登记的值。
message withdrawConsignment {
    bytes burnTxHash       = 1;
    bytes consignmentHash  = 2;
}

// withdrawStatus is the single-query withdrawal outcome. The terminal state is read from
// consensus state (settled / released); the local pending record is supplementary and may be
// absent on nodes that do not have it indexed.
message withdrawStatus {
    // Local pending record, present only when this node's local pending index has it.
    pendingTx pending = 1;
    // Consensus terminal state: "settled", "released", or empty when not final yet.
    string finalState = 2;
    // Consignment sha256 (hex) registered by the confirm transaction; empty if none.
    string consignmentHash = 3;
    // Derived status: pending / settled / released / unknown.
    string status = 4;
}

// effectiveBridgeConfig is the merged view of the global and per-asset governance records,
// using the same rules the executor applies (numericLimitsEnabled, independent pause flags).
message effectiveBridgeConfig {
    // Asset symbol used for the merge; empty addresses the global record.
    string assetSymbol = 1;
    // True when at least one effective record (global or asset) exists.
    bool configured = 2;
    // Merged effective values.
    bridgeConfigApply config = 3;
    // Activation height of an un-activated loosening; 0 when nothing is scheduled.
    int64 pendingActivationHeight = 4;
    // RGB20 fixed withdrawal fee for this asset in its smallest unit; 0 if unconfigured.
    int64 withdrawFeeMinUnits = 5;
}

service rgbx {}
